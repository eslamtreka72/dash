<title>Eslam Ezz</title>
<style>
:root{--tx:#eef3fb;--mu:#a9bad6;--gold:#f2b84b;--ok:#37c6a8;--mid:#f2b84b;--low:#ef6f5e;--gb:rgba(255,255,255,.2);--bl:22px;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{overflow-x:hidden;background:#0a1220}
body{max-width:100%;color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;font-size:15px;
 padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;filter:blur(36px);background:
 radial-gradient(38% 34% at 14% 18%,rgba(55,198,168,.50),transparent 70%),
 radial-gradient(34% 34% at 86% 12%,rgba(242,184,75,.38),transparent 70%),
 radial-gradient(44% 40% at 78% 86%,rgba(92,120,255,.46),transparent 70%),
 radial-gradient(34% 34% at 8% 88%,rgba(190,90,255,.32),transparent 70%)}
.wrap{max-width:1280px;margin:auto;min-width:0}
.glass,.card,header,dialog{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 62%);border:1px solid var(--gb);
 -webkit-backdrop-filter:blur(var(--bl)) saturate(175%);backdrop-filter:blur(var(--bl)) saturate(175%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.33)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,header,dialog{background:rgba(24,38,62,.92)}}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px;padding:12px 16px;border-radius:26px;max-width:100%;min-width:0}
.brandhd{display:flex;align-items:center;gap:16px;min-width:0;max-width:100%}
.logo{background:rgba(255,255,255,.93);border-radius:16px;padding:6px 12px;height:62px;display:flex;align-items:center;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(0,0,0,.25)}
.logo img{height:100%;width:auto;max-width:100%;display:block}
.who b{display:block;font-size:24px;letter-spacing:.3px}
.who span{color:var(--mu);font-size:13px}
h2{font-size:16px;font-weight:600;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:100%;min-width:0}
.bar>*{min-width:0}
input,select,button{font:inherit;color:var(--tx);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:9px 13px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
input[type=month]{max-width:170px}
option{background:#14213a;color:var(--tx)}
input:focus,select:focus,button:focus-visible{outline:2px solid rgba(255,214,120,.9);outline-offset:1px}
button{cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:rgba(255,255,255,.17)}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(180deg,#ffd983,#f2b84b);color:#1b1405;border-color:rgba(255,255,255,.55);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 16px rgba(242,184,75,.3)}
button.pri:hover{background:linear-gradient(180deg,#ffe3a0,#f7c35e)}
.seg{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.seg button{border:0;border-radius:0;background:transparent;color:var(--mu);flex:1;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.seg button.on{background:linear-gradient(180deg,#ffd983,#f2b84b);color:#1b1405;font-weight:700}
.seg button.on.r{background:linear-gradient(180deg,#ff9a8a,#ef6f5e);color:#fff}
.card{border-radius:26px;padding:18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 0% 0%,rgba(255,255,255,.13),transparent 55%)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:18px;padding:24px}
.ringbox{position:relative;width:190px;height:190px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(255,255,255,.12))}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .c b{font-size:36px}.ringbox .c span{color:var(--mu);font-size:13px}
.big{font-size:44px;font-weight:700;color:var(--gold);letter-spacing:-.5px;text-shadow:0 2px 18px rgba(242,184,75,.35)}
.big small{font-size:18px;color:var(--mu);font-weight:400;margin-inline-start:6px;text-shadow:none}
.lbl{color:var(--mu);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.stat b{display:block;font-size:19px;margin-top:2px}
.sec{margin:6px 6px 12px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px;margin-bottom:18px}
.brand{padding:16px}
.brand .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand .name{font-weight:700;font-size:17px;direction:ltr}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--mu)}
#sst{cursor:pointer}
.invc{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.unm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:10px;border:1px dashed var(--mid);border-radius:14px}
.unm select{max-width:100%}
.ok{color:var(--ok)}.warn{color:var(--mid)}.bad{color:#ff9a8a}
.calc{font-size:13px;min-height:16px;margin-top:2px;direction:ltr;text-align:start;color:var(--gold)}
.qk{display:flex;gap:6px}.qk button{flex:1;padding:7px 0;font-size:16px}
.ex{font-size:11px;direction:ltr;text-align:start;color:var(--mu)}
.pill.rt{color:#ff9a8a;border-color:rgba(239,111,94,.7)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-top:7px;gap:8px}
.row span:first-child{color:var(--mu)}
.track{height:9px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-top:6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.track i{display:block;height:100%;border-radius:9px;transition:width .5s;box-shadow:0 0 10px currentColor}
.pct{font-size:26px;font-weight:700}
.kin{width:120px;padding:6px 8px;text-align:end}
.two{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px}
form{display:grid;gap:10px}
form label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
form input,form select{width:100%}
.tw{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap}
th{color:var(--mu);font-weight:500;position:sticky;top:0;background:rgba(22,34,58,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
td.x button{padding:3px 10px;color:#ff9a8a}
.empty{color:var(--mu);padding:20px;text-align:center}
dialog{color:var(--tx);border-radius:28px;padding:20px;max-width:720px;width:94%;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07) 62%),rgba(14,24,44,.62)}
dialog::backdrop{background:rgba(4,8,18,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
dialog td input{width:110px;padding:6px 8px}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));inset-inline-start:20px;background:rgba(55,198,168,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#04201a;padding:10px 16px;border-radius:16px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(255,255,255,.5)}
.toast.show{opacity:1}
@media(max-width:820px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.two{grid-template-columns:1fr}}
@media(max-width:520px){:root{--bl:14px}body{padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
 header{padding:10px 12px}.big{font-size:34px}.logo{height:44px;padding:4px 8px}.who b{font-size:19px}.bar{gap:6px}.bar button,.bar input{padding:7px 9px;font-size:14px}.seg button{padding:7px 8px}.brandhd{gap:10px;width:100%}.hero{padding:16px}.ringbox{width:160px;height:160px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;cursor:pointer;
 background:radial-gradient(38% 34% at 14% 18%,rgba(55,198,168,.5),transparent 70%),radial-gradient(34% 34% at 86% 12%,rgba(242,184,75,.38),transparent 70%),radial-gradient(44% 40% at 78% 86%,rgba(92,120,255,.46),transparent 70%),radial-gradient(34% 34% at 8% 88%,rgba(190,90,255,.32),transparent 70%),#0a1220;
 animation:spOut .75s cubic-bezier(.4,0,.2,1) 2s forwards}
#splash.go{animation:spOut .35s ease forwards}
.sp-logo{position:relative;background:rgba(255,255,255,.95);border-radius:26px;padding:16px 26px;width:min(80vw,360px);box-shadow:inset 0 1px 0 #fff,0 18px 50px rgba(0,0,0,.45);animation:spIn 1s cubic-bezier(.2,.9,.3,1.15) .1s both}
.sp-logo img{display:block;width:100%;height:auto}
.sp-logo::after{content:"";position:absolute;inset:-8px;border-radius:32px;border:2px solid rgba(55,198,168,.65);animation:spPulse 1.5s ease-out .7s infinite}
.sp-name{font-size:22px;font-weight:700;letter-spacing:.4px;animation:spUp .8s ease .55s both}
.sp-sub{color:var(--mu);font-size:13px;margin-top:-14px;animation:spUp .8s ease .75s both}
.sp-bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;animation:spUp .6s ease .8s both}
.sp-bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#37c6a8,#f2b84b);animation:spBar 1.55s cubic-bezier(.4,0,.2,1) .5s forwards}
.wrap{animation:wrapIn .9s cubic-bezier(.2,.8,.2,1) 2.1s both}
.skip .wrap{animation-delay:.15s}
@keyframes spIn{from{opacity:0;transform:scale(.7) translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spPulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.14)}}
@keyframes spBar{to{width:100%}}
@keyframes spOut{to{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.07);filter:blur(12px)}}
@keyframes wrapIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash{animation:spOut .3s ease .5s forwards}.sp-logo,.sp-name,.sp-sub,.sp-bar,.sp-bar i{animation:none}.sp-bar i{width:100%}.sp-logo::after{display:none}.wrap{animation:none}}

.tabs{display:flex;gap:6px;padding:6px;border-radius:20px;margin-bottom:18px;overflow-x:auto;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border:1px solid var(--gb);-webkit-backdrop-filter:blur(var(--bl)) saturate(170%);backdrop-filter:blur(var(--bl)) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.28)}
.tabs button{flex:1;border:0;background:transparent;color:var(--mu);border-radius:15px;padding:10px 14px;white-space:nowrap;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.tabs button.on{background:linear-gradient(180deg,#ffd983,#f2b84b);color:#1b1405;font-weight:700}
.view{display:none}.view.on{display:block}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.ctl input[type=search]{flex:1;min-width:150px}
.clist{padding:6px 14px}
.crow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(90px,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer}
.crow:last-child{border:0}
.crow:hover{background:rgba(255,255,255,.05)}
.cn b{display:block;font-size:15px}.cn small{color:var(--mu);direction:ltr;display:inline-block}
.cv{text-align:end;min-width:110px}.cv .p{font-size:18px;font-weight:700}.cv small{display:block;color:var(--mu);font-size:12px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.2);margin-inline-start:6px;color:var(--mu)}
.chip.d{color:var(--ok);border-color:var(--ok)}.chip.z{color:#ff9a8a;border-color:#ef6f5e}
.cbtn{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--tx);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);margin:2px}
#cdlg,#idlg{max-width:780px}
.ytab td,.ytab th{padding:6px 8px;font-size:12.5px;text-align:center}
.btn2{width:100%}
.imps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:600px){.crow{grid-template-columns:1fr auto}.crow .cp{grid-column:1/-1;order:3}}

.pill.okp{color:var(--ok);border-color:var(--ok)}.pill.nop{color:#ff9a8a;border-color:#ef6f5e}
.invc b{display:block;margin-bottom:4px}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.mchips button{padding:5px 12px;font-size:13px;border-radius:99px}
.mchips button.on{background:rgba(242,184,75,.28);border-color:#f2b84b}
</style>

function parseXLS(ab){
  const u8=new Uint8Array(ab),dv=new DataView(ab);
  const sig=[0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1];
  for(let i=0;i<8;i++)if(u8[i]!==sig[i])throw new Error("notxls");
  const ss=1<<dv.getUint16(0x1E,true),ms=1<<dv.getUint16(0x20,true),cut=dv.getUint32(0x38,true);
  const nfat=dv.getUint32(0x2C,true),dirS=dv.getUint32(0x30,true),mfS=dv.getUint32(0x3C,true),nmf=dv.getUint32(0x40,true);
  let difS=dv.getUint32(0x44,true);const ndif=dv.getUint32(0x48,true);
  const sec=n=>{const o=(n+1)*ss;return u8.subarray(o,o+ss)};
  const dif=[];for(let i=0;i<109;i++){const v=dv.getUint32(0x4C+i*4,true);if(v<0xFFFFFFFA)dif.push(v)}
  for(let d=0,s=difS;d<ndif&&s<0xFFFFFFFA;d++){const o=(s+1)*ss,dd=new DataView(ab,o,ss);for(let i=0;i<ss/4-1;i++){const v=dd.getUint32(i*4,true);if(v<0xFFFFFFFA)dif.push(v)}s=dd.getUint32(ss-4,true)}
  const fat=[];dif.slice(0,nfat).forEach(s=>{const o=(s+1)*ss,dd=new DataView(ab,o,ss);for(let i=0;i<ss/4;i++)fat.push(dd.getUint32(i*4,true))});
  const chain=(s,tbl)=>{const r=[];let g=0;while(s<0xFFFFFFFA&&g++<1e6){r.push(s);s=tbl[s]}return r};
  const rd=(s,size)=>{const ch=chain(s,fat),out=new Uint8Array(ch.length*ss);ch.forEach((c,i)=>out.set(sec(c),i*ss));return size==null?out:out.subarray(0,size)};
  const dirb=rd(dirS),ents=[];
  for(let o=0;o+128<=dirb.length;o+=128){const d=new DataView(dirb.buffer,dirb.byteOffset+o,128),nl=d.getUint16(0x40,true);let nm="";for(let i=0;i<(nl>>1)-1;i++)nm+=String.fromCharCode(d.getUint16(i*2,true));ents.push({nm,type:d.getUint8(0x42),start:d.getUint32(0x74,true),size:d.getUint32(0x78,true)})}

  const cnt={};S.invs.forEach(v=>{if(!v.del){const k=mkey(v.date);cnt[k]=(cnt[k]||0)+1}});
  const m=$("month").value;
  $("mchips").innerHTML=Object.keys(cnt).sort().map(k=>{const c=CAL.find(x=>x.k===k);return `<button type="button" data-mk="${k}" class="${k===m?"on":""}">${c&&S.cal!=="gr"?MN[c.i]+" "+c.y:k} · ${cnt[k]} ${t("invsN")}</button>`}).join("");
}
$("mchips").onclick=e=>{const b=e.target.closest("[data-mk]");if(!b)return;const sel=$("month");if(![...sel.options].some(o=>o.value===b.dataset.mk)){const o=document.createElement("option");o.value=b.dataset.mk;o.textContent=b.dataset.mk;sel.appendChild(o)}sel.value=b.dataset.mk;render()};
function render(){renderChips();renderDash();renderCust();renderItems();$("cdl").innerHTML=Object.entries(S.custdb.map).map(([c,x])=>`<option value="${esc(c)} — ${esc(x.n)}">`).join("")}

/* ---------- tabs ---------- */
function setTab(x){tab=x;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===x));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v_"+x))}
$("tabs").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b)setTab(b.dataset.tab)};

/* ---------- header / form handlers ---------- */
$("month").onchange=render;
$("seg").onclick=e=>{const b=e.target.dataset.b;if(b){S.base=b;save();render()}};
$("btnL").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";save();applyLang();render()};
$("ftseg").onclick=e=>{const b=e.target.dataset.t;if(!b)return;cur=b;document.querySelectorAll("#ftseg button").forEach(x=>{x.classList.toggle("on",x.dataset.t===b);x.classList.toggle("r",b==="return"&&x.dataset.t==="return")})};
function pv(inp,out,cart){const raw=inp.value.trim(),v=calc(raw);
  out.textContent=!raw||/^\d*\.?\d*$/.test(raw)?"":isNaN(v)?"?":"= "+(cart?fmtC(v):fmt(v,2));
  out.style.color=isNaN(v)?"var(--low)":"var(--gold)"}
let lastF=$("fa");
["fa","fc"].forEach(id=>{const f=$(id);f.addEventListener("input",()=>pv(f,$(id+"_r"),id==="fc"));f.addEventListener("focus",()=>{lastF=f})});
document.querySelectorAll(".qk button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();const f=lastF||$("fa");f.focus();const a=f.selectionStart==null?f.value.length:f.selectionStart,z=f.selectionEnd==null?a:f.selectionEnd;f.setRangeText(b.dataset.c,a,z,"end");f.dispatchEvent(new Event("input"))}));
$("f").onsubmit=e=>{e.preventDefault();
  const ra=$("fa").value,rc=$("fc").value,a=calc(ra),c=calc(rc);
  if(isNaN(a)||a<0||isNaN(c)||c<0){toast(t("badNum"));return}
  const cm=/^[A-Za-z]{2,5}-\d+/.exec($("fcu").value.trim()),cc=cm?cm[0]:"",cr=cc&&S.custdb.map[cc];
  S.sales.push({id:uid(),date:$("fd").value,brand:$("fb").value,amount:a,cartons:c,type:cur,cc,cn:cr?cr.n:"",ea:isFormula(ra)?ra.trim().replace(/^=/,""):"",ec:isFormula(rc)?rc.trim().replace(/^=/,""):""});
  save();setMonthFor($("fd").value);
  $("fa").value="";$("fc").value="";$("fcu").value="";$("fa_r").textContent="";$("fc_r").textContent="";$("fa").focus();render();toast(t("saved"));
};
$("log").onclick=e=>{
  const iv=e.target.dataset.delinv;
  if(iv){const v=S.invs.find(q=>q.id==iv);if(v&&confirm(t("confirmDelInv").replace("{n}",v.no))){v.del=1;save();render()}return}
  const id=e.target.dataset.del;if(!id)return;const x=S.sales.find(q=>q.id==id);if(!x)return;
  if(x.inv){if(confirm(t("confirmDelInv").replace("{n}",x.inv)))S.sales.forEach(q=>{if(q.inv===x.inv)q.del=1})}
  else if(confirm(t("confirmDel")))x.del=1;
  save();render()};
$("brands").onclick=e=>{const c=e.target.closest("[data-brand]");if(c)showBrand(c.dataset.brand)};
$("bdclose").onclick=()=>$("bdlg").close();
$("others").onchange=e=>{const k=e.target.dataset.k;if(!k)return;const m=$("month").value;(S.act[m]=S.act[m]||{})[k]=parseFloat(e.target.value)||0;S.tsA[m]=Date.now();save();render();toast(t("upd"))};

/* ---------- targets dialog ---------- */
function sum(){let s=0;document.querySelectorAll("#tt input[data-k=comm]").forEach(i=>s+=parseFloat(i.value)||0);const e=$("tsum");e.textContent=t("tSum")+": "+fmt(s,1)+"%";e.style.color=Math.abs(s-100)<0.05?"var(--ok)":"var(--mid)"}
$("btnT").onclick=()=>{
  $("tt").innerHTML=`<thead><tr><th>${t("tBrand")}</th><th>${t("tMoney")}</th><th>${t("tCartons")}</th><th>${t("tComm")}</th></tr></thead><tbody>`+
   BR.map(b=>{const o=S.targets[b];return `<tr><td><b>${b}</b></td><td><input type="number" step="0.01" min="0" data-b="${b}" data-k="money" value="${o.money}"></td><td><input type="number" step="any" min="0" data-b="${b}" data-k="cartons" value="${o.cartons}"></td><td><input type="number" step="0.1" min="0" data-b="${b}" data-k="comm" value="${o.comm}"></td></tr>`}).join("")+
   `<tr><th colspan="4">${t("tOthers")}</th></tr>`+
   OT.map(([key])=>{const o=S.ot[key];return `<tr><td><b>${t("o_"+key)}</b></td><td><input type="number" step="any" min="0" data-o="${key}" data-k="target" value="${o.target}"></td><td></td><td><input type="number" step="0.1" min="0" data-o="${key}" data-k="comm" value="${o.comm}"></td></tr>`}).join("")+`</tbody>`;
  $("vsel").value=S.vatMode||"mul";$("calsel").value=S.cal;$("repn").value=S.rep;
  sum();$("dlg").showModal();
};
$("tt").oninput=sum;
$("tcancel").onclick=()=>$("dlg").close();
$("tsave").onclick=()=>{
  document.querySelectorAll("#tt input").forEach(i=>{const v=parseFloat(i.value)||0;if(i.dataset.b)S.targets[i.dataset.b][i.dataset.k]=v;else S.ot[i.dataset.o][i.dataset.k]=v});
  S.vatMode=$("vsel").value;S.rep=$("repn").value.trim()||DEFREP;
  const cal=$("calsel").value;if(cal!==S.cal){S.cal=cal;monthOpts()}
  S.tsT=Date.now();save();$("dlg").close();render();toast(t("tSaved"))};

/* ---------- backup / restore ---------- */
$("btnE").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,sync:null})],{type:"application/json"}));a.download="dashboard-backup-"+today()+".json";a.click()};
$("btnI").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const d=fix(JSON.parse(r.result));if(!d.targets||!d.sales)throw 0;
    if(confirm(t("mergeQ"))){mergeInto(d)}else{const lg=S.lang,sy=S.sync;S=d;S.lang=lg;S.sync=sy;S.tsT=Date.now()}
    save();applyLang();monthOpts();render();toast(t("restored"));
  }catch(x){alert(t("badFile"))}};
  r.readAsText(f);e.target.value=""};

/* ---------- invoice import ---------- */
function startImp(mode){impMode=mode;$("ifile").click()}
$("btnImpS").onclick=()=>startImp("sale");
$("btnImpR").onclick=()=>startImp("return");
$("ifile").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length)return;
  pendInv=[];const errs=[];
  for(const f of files){try{const iv=extractInvoice(parseXLS(await f.arrayBuffer()),S.rules);iv.file=f.name;pendInv.push(iv)}catch(x){errs.push(f.name)}}
  showImp(errs);
};
function lineCartons(iv){let c=0,unk=0;iv.lines.forEach(l=>{l.ct=cartonsOf(l);if(l.ct==null)unk++;else c+=l.ct});iv.cartons=c;iv.unk=unk}
function showImp(errs){
  $("itit").textContent=t(impMode==="return"?"impTitleR":"impTitleS");
  const un={},pk={};
  pendInv.forEach(iv=>iv.lines.forEach(l=>{
    if(!l.b){const u=un[l.tk]||(un[l.tk]={n:0,sum:0,ex:l.name});u.n++;u.sum+=l.value}
    l.ct=cartonsOf(l);if(l.ct==null&&l.code&&num(l.qty)){const p=pk[l.code]||(pk[l.code]={nm:l.name,q:0});p.q+=l.qty}}));
  let h="";
  if(!Object.keys(S.items.map).length)h+=`<div class="warn" style="margin-bottom:8px">${t("impNoItems")}</div>`;
  pendInv.forEach((iv,i)=>{
    lineCartons(iv);
    const exv=S.invs.find(v=>!v.del&&v.no===iv.inv&&v.mode===impMode),exact=!!exv,legacy=!exact&&S.sales.some(s=>!s.del&&s.inv===iv.inv&&s.src==="xls");
    iv.dup=!!iv.inv&&exact;iv.legacy=legacy;iv.exm=exv?mlabel(mkey(exv.date)):"";
    const ok=iv.expected!=null&&Math.abs(iv.sum-iv.expected)<0.05,by={};
    iv.lines.forEach(l=>{if(l.b){const o=by[l.b]||(by[l.b]={v:0,c:0});o.v+=l.value;o.c+=l.ct||0}});
    const cr=S.custdb.map[iv.ccode];
    h+=`<div class="invc"><label style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="checkbox" data-use="${i}" ${iv.dup?"":"checked"}><b dir="ltr">${esc(iv.inv||iv.file)}</b><span class="lbl" dir="auto">${esc(iv.customer)} · ${esc(iv.date)}</span></label>
     <div class="lbl" style="margin-top:4px">${t("countsIn")} <b style="display:inline">${mlabel(mkey(iv.date||today()))}</b></div>
     <div class="lbl" style="margin-top:6px">${iv.lines.length} ${t("itemsN")} · ${fmt(iv.sum,2)} · ${fmtC(iv.cartons)} ${t("cartons")} <span class="${ok?"ok":"warn"}">${ok?"✓ "+t("impMatch"):iv.expected!=null?"⚠ "+t("impMis")+" "+fmt(iv.expected,2):""}</span>${iv.isReturn&&impMode==="sale"?` · <span class="bad">${t("impRet")}</span>`:""}${iv.dup?` · <span class="warn">${t("impDup")} · ${iv.exm}</span>`:""}${legacy?` · <span class="ok">${t("legacyUpd")}</span>`:""}</div>
     <div class="lbl" style="margin-top:4px" dir="auto">${iv.ccode?esc(iv.ccode)+" · ":""}${cr?`<span class="ok">${t("custIn")}</span>`:`<span class="warn">${t("custOut")}</span>`}</div>
     <div class="chips">${Object.keys(by).map(b=>`<span class="pill">${b} ${fmt(by[b].v,2)} · ${fmtC(by[b].c)}</span>`).join("")}</div></div>`;
  });
  const pc=Object.keys(pk);
  if(pc.length)h+=`<div class="lbl" style="margin:6px 0">${t("packTitle")}</div>`+pc.map(k=>`<div class="unm"><b dir="ltr">${esc(k)}</b><span class="lbl" dir="auto" style="flex:1">${esc(pk[k].nm)} · ${fmtC(pk[k].q)} ${t("unitsL")}</span><input type="number" min="1" step="any" data-pk="${esc(k)}" placeholder="${t("perCarton")}" style="width:120px"></div>`).join("");
  const tk=Object.keys(un);
  if(tk.length)h+=`<div class="lbl" style="margin:6px 0">${t("impUnk")}</div>`+tk.map(k=>`<div class="unm"><b dir="auto">${esc(k)}</b><span class="lbl">${un[k].n} ${t("itemsN")} · ${fmt(un[k].sum,2)}</span><span class="lbl" dir="auto">${esc(un[k].ex)}</span><select data-un="${esc(k)}"><option value="">${t("impSkip")}</option>${BR.map(b=>`<option>${b}</option>`).join("")}</select><label class="lbl"><input type="checkbox" data-rem="${esc(k)}" checked> ${t("impRem")}</label></div>`).join("");
  if(errs&&errs.length)h+=`<div class="bad" style="margin-top:8px">${t("badXls")}: ${errs.map(esc).join(" , ")}</div>`;
  const rl=Object.keys(S.rules||{});
  if(rl.length)h+=`<div class="lbl" style="margin-top:10px">${t("impRules")}: ${rl.map(k=>`<span class="pill">${esc(k)} → ${esc(S.rules[k])} <button type="button" data-rdel="${esc(k)}" style="padding:0 6px;border-radius:8px">×</button></span>`).join(" ")}</div>`;
  $("ibody").innerHTML=h;if(!$("idlg").open)$("idlg").showModal();
}
$("ibody").onclick=e=>{const k=e.target.dataset.rdel;if(!k)return;delete S.rules[k];save();pendInv.forEach(iv=>iv.lines.forEach(l=>{const m=brandOf(l.name,S.rules);l.b=m.b;l.tk=m.tk}));showImp([])};
$("icancel").onclick=()=>$("idlg").close();
$("iok").onclick=()=>{
  const asg={};document.querySelectorAll("#ibody [data-un]").forEach(q=>{asg[q.dataset.un]=q.value});
  document.querySelectorAll("#ibody [data-rem]").forEach(c=>{const k=c.dataset.rem;if(c.checked&&asg[k])S.rules[k]=asg[k]});
  document.querySelectorAll("#ibody [data-pk]").forEach(q=>{const v=parseFloat(q.value);if(v>0)S.pk[q.dataset.pk]=v});
  let n=0,last="";
  document.querySelectorAll("#ibody [data-use]").forEach(c=>{
    if(!c.checked)return;const iv=pendInv[+c.dataset.use];
    if(iv.legacy)S.sales.forEach(s=>{if(s.src==="xls"&&s.inv===iv.inv)s.del=1});
    const date=iv.date||today();
    S.invs.push({id:uid(),no:iv.inv||iv.file,date,cc:iv.ccode||"",cn:iv.customer||"",mode:impMode,file:iv.file,
      L:iv.lines.map(l=>{const b=l.b||asg[l.tk]||"",row=[l.code,l.qty==null?0:l.qty,l.unit,Math.round(Math.abs(l.value)*100)/100,Math.round(Math.abs(l.net)*100)/100,b];if(!S.items.map[l.code]||!b)row.push(l.name);return row})});
    n++;last=date;
  });
  $("idlg").close();
  if(n){save();setMonthFor(last);render();toast(t("impDone").replace("{n}",n)+" · "+mlabel(mkey(last)))}
};

/* ---------- databases ---------- */
$("btnPrice").onclick=()=>$("pfile").click();
$("pfile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;toast(t("reading"));
  try{const n=await importItems(f);save();render();toast(t("itemsDone").replace("{n}",n))}catch(x){alert(t("badBook"))}};
$("btnCust").onclick=()=>$("cfile").click();
$("cfile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;toast(t("reading"));
  try{const n=await importCust(f);save();render();toast(t("custDone").replace("{n}",n))}
  catch(x){alert(x.message==="nofinal"?t("noFinal"):x.message==="norep"?t("noRep").replace("{r}",S.rep):t("badBook"))}};
$("iq").oninput=renderItems;
$("cq").oninput=e=>{cf.q=e.target.value;renderCust()};
$("cst").onchange=e=>{cf.st=e.target.value;renderCust()};
$("csort").onchange=e=>{cf.sort=e.target.value;renderCust()};
$("csrc").onclick=e=>{const s=e.target.dataset.s;if(s){S.csrc=s;save();renderCust()}};
$("clist").onclick=e=>{const r=e.target.closest(".crow");if(r)showCust(r.dataset.cc)};
$("cdclose").onclick=()=>$("cdlg").close();

/* ---------- sync dialog ---------- */
$("sst").onclick=()=>sync();
$("splash").onclick=()=>{$("splash").classList.add("go");document.body.classList.add("skip")};
$("btnS").onclick=()=>{$("surl").value=(S.sync&&S.sync.url)||"";$("stok").value=(S.sync&&S.sync.token)||"";$("smsg").textContent="";$("sdlg").showModal()};
$("sclose").onclick=()=>$("sdlg").close();
$("soff").onclick=()=>{S.sync=null;save(false);status("sOk");$("sdlg").close()};
$("ssave").onclick=async()=>{const u=$("surl").value.trim(),k=$("stok").value.trim();if(!u||!k){$("smsg").textContent=t("sNeed");return}S.sync={url:u,token:k};save(false);$("sdlg").close();await sync()};
addEventListener("online",sync);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
$("fb").innerHTML=BR.map(b=>`<option>${b}</option>`).join("");
$("fd").value=today();
applyLang();monthOpts();render();sync();

</script>
</body>
</html>
